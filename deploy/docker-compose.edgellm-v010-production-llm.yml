# Orin NX-only Qwen3.5 production service. Image and model identities are
# mandatory outputs of the externally verified final release lock.
services:
  edge-llm-v010:
    container_name: edge-llm-chat-service-v010
    image: ${EDGE_LLM_V010_IMAGE:?set digest-pinned v0.10 LLM image ref}
    runtime: nvidia
    privileged: true
    ipc: host
    restart: unless-stopped
    shm_size: "512m"
    environment:
      EDGELLM_MODEL_PROFILE: qwen35-4b-gdn-mtp
      EDGELLM_MODEL_NAME: Qwen/Qwen3.5-4B
      EDGELLM_ENGINE_PROFILE: ${EDGELLM_V010_ENGINE_PROFILE:-8k}
      EDGELLM_ENGINE_DIR: /workspace/models-v010/qwen3.5-4b-gdn-mtp
      EDGELLM_SPEC_DECODE_ENGINE_DIR: /workspace/models-v010/qwen3.5-4b-gdn-mtp
      EDGELLM_MTP_ENABLED: "1"
      EDGELLM_DRAFT_TOP_K: "1"
      EDGELLM_DRAFT_STEP: "3"
      EDGELLM_VERIFY_TREE_SIZE: "4"
      EDGELLM_EXPECTED_TENSORRT: 10.3.0.30
      EDGELLM_EXPECTED_MAX_INPUT_LEN: ${EDGELLM_V010_EXPECTED_MAX_INPUT_LEN:-8192}
      EDGELLM_EXPECTED_MAX_KV_CACHE_CAPACITY: ${EDGELLM_V010_EXPECTED_MAX_KV_CACHE_CAPACITY:-8192}
      EDGELLM_MAX_INPUT_TOKENS: ${EDGELLM_V010_MAX_INPUT_TOKENS:-8192}
      EDGELLM_MAX_CONTEXT_TOKENS: ${EDGELLM_V010_MAX_CONTEXT_TOKENS:-8192}
      EDGELLM_SPECULATIVE_TOKEN_SLACK: "128"
      EDGELLM_EXPECTED_ENGINE_COMMIT: 71dd1bae032e70771265917ec74d3ff4cad07a10
      EDGELLM_ENGINE_REPO: harvestsu/qwen3.5-4b-gdn-mtp-jetson-artifacts
      EDGELLM_ENGINE_REVISION: ${EDGELLM_V010_ENGINE_REVISION:?set immutable v0.10 engine revision}
      EDGELLM_EXPECTED_PAYLOAD_SHA256: ${EDGELLM_V010_EXPECTED_PAYLOAD_SHA256:?set v0.10 payload sha256}
      EDGELLM_SKIP_ENGINE_PROVENANCE_CHECK: "0"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
    volumes:
      - edge-llm-models-v010:/workspace/models-v010
      - /usr/local/cuda/lib64:/host-cuda:ro
      - /usr/local/cuda/targets/aarch64-linux/lib:/host-cudla:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/host-nvidia-libs:ro
      - /lib/aarch64-linux-gnu:/host-libs:ro
    ports:
      - "${EDGE_LLM_V010_PORT:-8000}:8000"

volumes:
  edge-llm-models-v010:
    name: edge-llm-models-v010

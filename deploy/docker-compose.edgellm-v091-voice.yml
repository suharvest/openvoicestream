# Standalone production service for the validated Orin NX host.
# The normal Base profile keeps ASR and TTS resident at N=1 while GDN remains
# active on the same 16GB device. Stop GDN and select qwen3ttsbase-isolated-n2
# only for isolated Base N=2 validation.
services:
  speech:
    container_name: seeed-voice-v091
    image: seeed-local-voice:v0.9.1-edgellm-runtime-r11-20260803
    runtime: nvidia
    ipc: host
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.jetson.edgellm-v091-runtime
      args:
        BASE: sensecraft-missionpack.seeed.cn/solution/seeed-local-voice:jetson-v1.14-hotswap
    environment:
      LANGUAGE_MODE: multilanguage
      OVS_PROFILE: jetson-edgellm-v091-qwen3ttsbase
      OVS_WORKER_IO_QUEUE_WHEN_SATURATED: "0"
      QWEN3_ARTIFACT_MANIFEST: /opt/qwen3-edgellm-jetson/deploy/artifacts/qwen3_manifest.json
      QWEN3_ARTIFACT_SET: orin-nx-edgellm-v091-jp62-trt103-sm87-20260803-r4
      QWEN3_ARTIFACT_ROOT: /opt/edgellm-v091
      QWEN3_HF_REPO_ID: harvestsu/qwen3-edgellm-jetson-artifacts
      TTS_PROVIDER: cuda
      STREAMING_ASR_PROVIDER: cuda
      CUDA_MODULE_LOADING: LAZY
      OVS_LOG_FORMAT: text
      PYTHONPATH: /opt/speech:/usr/lib/python3.10/dist-packages
      LD_LIBRARY_PATH: /usr/local/lib/python3.10/dist-packages/onnxruntime/capi:/host-cuda:/host-nvidia-libs:/host-libs
    ports:
      - "8621:8000"
    volumes:
      - /usr/lib/python3.10/dist-packages/tensorrt:/usr/lib/python3.10/dist-packages/tensorrt:ro
      - /usr/src/tensorrt:/usr/src/tensorrt:ro
      - speech-models:/opt/models
      - /home/harvest/edgellm-artifacts/orin-nx-edgellm-v091-jp62-trt103-sm87-20260803-r4/v091:/opt/edgellm-v091:ro
      - /usr/local/cuda/lib64:/host-cuda:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/host-nvidia-libs:ro
      - /lib/aarch64-linux-gnu:/host-libs:ro
    mem_limit: 8g
    memswap_limit: 14g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/readyz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

volumes:
  speech-models:
    name: speech-models
